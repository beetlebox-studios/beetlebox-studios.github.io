<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeetleBox Studios</title>
  <link rel="icon" type="image/png" />
  <script>
    // Theme before first paint: saved choice, else the system preference
    (function () {
      var saved = new URLSearchParams(location.search).get('theme');
      if (saved !== 'light' && saved !== 'dark') saved = null;
      try { saved = saved || localStorage.getItem('theme'); } catch (e) {}
      var light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<footer id="site-footer">

    <a class="footer-version" id="footer-version" href="https://github.com/beetlebox-studios/beetlebox-studios.github.io/releases" target="_blank" rel="noopener" hidden></a>
    <a class="footer-github" href="https://github.com/beetlebox-studios" target="_blank" rel="noopener" aria-label="BeetleBox Studios on GitHub"><i class="fa-brands fa-github"></i></a>
  <script>
    document.querySelector('.footer-copy').textContent =
      `© BeetleBox Studios ${new Date().getFullYear()} · Philadelphia, PA`;
    fetch('package.json')
      .then(r => r.json())
      .then(({ version }) => {
        const link = document.getElementById('footer-version');
        link.textContent = 'v' + version;
        link.hidden = false;
      })
      .catch(() => {});
  </script>
